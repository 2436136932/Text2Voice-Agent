[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# NOTE: do not add -q here. pytest's quiet flags are cumulative, so an addopts
# -q plus a -q on the command line becomes -qq, which SUPPRESSES the summary
# line entirely -- a passing suite then looks like "no output / 0 passed" and
# reads as catastrophic failure. That trap fooled two separate agents on this
# project, so the terseness is left to whoever runs the suite.
addopts = --strict-markers --tb=short
filterwarnings =
    ignore::DeprecationWarning